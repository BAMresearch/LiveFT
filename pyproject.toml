[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "liveft"
version = "0.1.0"
description = "Live Fourier transform visualization of a camera feed"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Brian R. Pauw", email = "brian@stack.nl" },
    { name = "I. Bressler" },
]
dependencies = [
    "attrs",
    "numpy",
    "opencv-python>=4,<6",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.scripts]
liveft = "LiveFT:main"

[project.urls]
Homepage = "https://github.com/BAMresearch/LiveFT"
Repository = "https://github.com/BAMresearch/LiveFT.git"
Issues = "https://github.com/BAMresearch/LiveFT/issues"

[tool.setuptools]
py-modules = ["LiveFT"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "binaries",
    "experiments",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
